# The Kustomize deployment behind the kind cluster's ingress, for scripts/kind-up.sh --kustomize.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../components/server
  - ../../components/runner
  - ../../components/agent
  - ingress.yaml

patches:
  # Server.Host is the token issuer, so it has to be the URL the browser uses.
  - target:
      kind: Deployment
      name: snapcd-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Server__Host
          value: http://snapcd.localhost:9080
