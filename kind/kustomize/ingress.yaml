apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snapcd-server
  namespace: snapcd-server
spec:
  ingressClassName: nginx
  rules:
    - host: snapcd.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snapcd-server
                port:
                  name: http
