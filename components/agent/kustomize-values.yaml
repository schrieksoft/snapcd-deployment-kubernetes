# Values for rendering components/agent/generated.yaml with scripts/render-kustomize.sh.
# Names, ConfigMaps and Secrets match what kustomization.yaml generates from config/.
fullnameOverride: snapcd-agent
config:
  existingConfigMap: snapcd-agent-config
credentials:
  existingSecret: snapcd-agent-credentials
sidecar:
  credentials:
    existingSecret: snapcd-agent-sidecar-claude-credentials
serviceAccount:
  create: false
