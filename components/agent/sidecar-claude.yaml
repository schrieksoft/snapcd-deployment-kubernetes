apiVersion: v1
kind: Service
metadata:
  name: snapcd-agent-sidecar-claude
  labels:
    app: snapcd-agent-sidecar-claude
spec:
  selector:
    app: snapcd-agent-sidecar-claude
  ports:
    - name: http
      port: 7001
      targetPort: 7001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapcd-agent-sidecar-claude
  labels:
    app: snapcd-agent-sidecar-claude
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snapcd-agent-sidecar-claude
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: snapcd-agent-sidecar-claude
    spec:
      containers:
        - name: snapcd-agent-sidecar-claude
          image: ghcr.io/schrieksoft/snapcd/snapcd-agent-sidecar-claude:1.12.10
          env:
            # MCP is served at {SNAPCD_BASE_URL}/mcp.
            - name: SNAPCD_BASE_URL
              value: "http://snapcd-server.snapcd-server.svc.cluster.local:5000"
            # Claude auth, read from the process environment by the Claude Code CLI.
            # Exactly one of the two is required; both keys are optional in the Secret.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: snapcd-agent-sidecar-claude-credentials
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: snapcd-agent-sidecar-claude-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true
            # PAT used by the pre-installed git/gh for the AutoFix path (clone + open PR).
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: snapcd-agent-sidecar-claude-credentials
                  key: GITHUB_TOKEN
                  optional: true
          ports:
            - containerPort: 7001
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
