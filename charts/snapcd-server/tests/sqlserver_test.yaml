suite: sqlserver
templates:
  - sqlserver.yaml
release:
  name: snapcd-server
  namespace: snapcd-server
tests:
  - it: fails without a password source
    set:
      sqlserver.auth.saPassword: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sqlserver.auth.saPassword or sqlserver.auth.existingSecret is required'

  - it: keeps the claim template name stable, since renaming it orphans the data
    set:
      sqlserver.auth.saPassword: p
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: mssqldata

  - it: uses the existing Secret and creates none
    set:
      sqlserver.fullnameOverride: sqlserver
      sqlserver.auth.saPassword: ""
      sqlserver.auth.existingSecret: sqlserver-credentials
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: sqlserver
        documentSelector:
          path: kind
          value: StatefulSet

  - it: renders nothing when disabled
    set:
      sqlserver.enabled: false
    asserts:
      - hasDocuments:
          count: 0
