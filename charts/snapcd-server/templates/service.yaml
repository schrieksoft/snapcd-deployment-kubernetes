apiVersion: v1
kind: Service
metadata:
  name: {{ include "snapcd-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-server.labels" (dict "ctx" $ "component" "server") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "snapcd-server.selectorLabels" (dict "ctx" $ "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
