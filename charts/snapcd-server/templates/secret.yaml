{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snapcd-server.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-server.labels" (dict "ctx" $ "component" "server") | nindent 4 }}
type: Opaque
data:
  appsettings.json: {{ include "snapcd-server.appsettings" . | b64enc }}
{{- end }}
