image:
  # -- Image registry. Set to a mirror (Artifactory, Harbor, ACR) to pull through it.
  registry: ghcr.io
  # -- Image repository.
  repository: schrieksoft/snapcd/snapcd-server
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image digest. Takes precedence over the tag when set.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for every workload in the chart.
imagePullSecrets: []

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name of the Server.
fullnameOverride: ""

# -- Labels added to every resource.
commonLabels: {}

# -- Value of `ASPNETCORE_ENVIRONMENT`.
aspnetcoreEnvironment: Production

config:
  # -- Name of an existing Secret holding `appsettings.json`. When set, `config.appsettings` is ignored and the chart derives nothing into it.
  existingSecret: ""
  # -- Key of `appsettings.json` in `config.existingSecret`.
  existingSecretKey: appsettings.json
  # -- The Server's `appsettings.json` as a map, rendered into a Secret. The chart fills `ConnectionString`, the SQL Server transport connection string and `Caching` from the bundled SQL Server and Redis when those are enabled and the keys are absent, and `Server.Host` from the ingress or HTTPRoute host, or `http://localhost:<service.port>` for a port-forward. The defaults are the reference deployment's sample settings, the same as `components/server/config/appsettings.json` and the Docker deployment: they work as installed, and every key, password and pre-seeded credential in them is public, so replace them before the Server holds anything that matters. See the Snap CD server settings reference for every key.
  # @default -- the reference deployment's sample settings
  appsettings:
    AllowHttp: true
    Turnstile:
      IsEnabled: false
    Caching:
      Provider: Redis
    Logging:
      LogLevel:
        Default: Warning
        SnapCd: Information
    BackgroundJobs:
      SourceRefresh:
        Cron: '*/9 * * * *'
    ServiceBus:
      BusType: SqlServer
      SagaConcurrencyLimit: 20
      TransportOptions:
        SqlServer:
          Schema: transport
    InvitationSettings:
      ExpirationDays: 30
      AutoDeleteIncompleteUsers: true
      RequireEmailVerification: false
    EmailSender:
      EmailProvider: NoOp
    OpenIdConnect:
      TokenEncryption:
        SymmetricKey: |-
          -----BEGIN SYMMETRIC KEY-----
          0wwsxvf4MgL3RySlmhvGqkCYslI1YYu4mu1hwr5upJs=
