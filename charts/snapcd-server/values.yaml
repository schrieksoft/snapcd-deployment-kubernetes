database:
  # -- Connection string to an external SQL Server database, merged into `appsettings.json` as `ConnectionString` and the SQL Server transport connection string.
  connectionString: ""
  # -- Name of an existing Secret holding the connection string. Injected as environment variables, so it works with `config.existingSecret` too.
  existingSecret: ""
  # -- Key of the connection string in `database.existingSecret`.
  existingSecretKey: connection-string

cache:
  # -- Connection string to an external Redis, merged into `appsettings.json` as `Caching.ConnectionString`.
  connectionString: ""
  # -- Name of an existing Secret holding the Redis connection string. Injected as an environment variable.
  existingSecret: ""
  # -- Key of the connection string in `cache.existingSecret`.
  existingSecretKey: connection-string

serviceAccount:
  # -- Create a ServiceAccount for the Server.
  create: true
  # -- ServiceAccount name. Defaults to the full name when `create` is true, and to `default` otherwise.
  name: ""
  # -- ServiceAccount annotations, for example `azure.workload.identity/client-id`.
  annotations: {}
  # -- Mount the ServiceAccount token into the pod.
  automount: true

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels, for example `azure.workload.identity/use: "true"`.
podLabels: {}
# -- Pod security context. The defaults meet the restricted pod security profile; the images run as UID and GID 1654, and `fsGroup` makes provisioned volumes writable by it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault
# -- Container security context. The defaults meet the restricted pod security profile.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Container resources.
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: 2000m

# -- Deployment strategy. `Recreate`, because the Server runs as a single replica.
strategy:
  type: Recreate

# -- Startup probe. Liveness and readiness wait for it to pass, so a slow start is not killed: after a restart against a running database, the Server's message bus can take minutes to start.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 60

# -- Readiness probe.
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6

# -- Liveness probe.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Priority class name.
priorityClassName: ""

# -- Extra environment variables for the Server container.
extraEnv: []
# -- Extra `envFrom` sources for the Server container.
extraEnvFrom: []
# -- Extra volumes for the Server pod.
extraVolumes: []
# -- Extra volume mounts for the Server container.
extraVolumeMounts: []
# -- Init containers for the Server pod.
initContainers: []
# -- Extra containers (sidecars) for the Server pod.
extraContainers: []

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 5000
  # -- Service annotations.
  annotations: {}

ingress:
  # -- Create an Ingress for the Server.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Host the Server is reached on. Sets `Server.Host` when that is absent, and must agree with it when present.
  host: ""
  # -- Path.
  path: /
  # -- Path type.
  pathType: Prefix
  # -- TLS entries. Any entry makes `Server.Host` an `https` URL.
  tls: []
  # -- Port clients reach the ingress on, when it is not the scheme's default. Appended to the derived `Server.Host`.
  publicPort: ""
  #  - secretName: snapcd-server-tls
  #    hosts:
  #      - snapcd.example.com

httpRoute:
  # -- Create a Gateway API HTTPRoute for the Server.
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {}
  # -- Gateways the route attaches to.
  parentRefs: []
  #  - name: public
  #    namespace: istio-ingress
  # -- Hostnames. The first one sets `Server.Host` when that is absent, and must agree with it when present.
  hostnames: []
  # -- Scheme the Gateway serves the hostnames on, used to build `Server.Host`.
  scheme: https
  # -- Port clients reach the Gateway on, when it is not the scheme's default. Appended to the derived `Server.Host`.
  publicPort: ""

podDisruptionBudget:
  # -- Create a PodDisruptionBudget. With a single replica, `minAvailable: 1` blocks every node drain.
  enabled: false
  # -- Minimum available pods.
  minAvailable: ""
  # -- Maximum unavailable pods.
  maxUnavailable: 1

sqlserver:
  # -- Deploy a bundled SQL Server. For trials; use `database.*` for a managed database.
  enabled: true
  # -- Overrides the full resource name of the SQL Server.
  fullnameOverride: ""
  image:
    # -- SQL Server image registry.
    registry: mcr.microsoft.com
    # -- SQL Server image repository.
    repository: mssql/server
    # -- SQL Server image tag.
    tag: 2022-latest
    # -- SQL Server image digest.
    digest: ""
    # -- SQL Server image pull policy.
    pullPolicy: IfNotPresent
  # -- Value of `MSSQL_PID`.
  edition: Developer
  nodePort:
    # -- Expose SQL Server on a node port. For a local cluster only: it puts the database on the
    # host, reachable by anything that can reach the node.
    enabled: false
    # -- Node port to expose SQL Server on. Must be within the cluster's node port range, and on
    # kind the same port must be mapped when the cluster is created.
    port: 31433
  auth:
    # -- `sa` password. The default is the reference deployment's public sample password.
    saPassword: myPassw0rd
    # -- Name of an existing Secret holding the `sa` password.
    existingSecret: ""
    # -- Key of the password in `sqlserver.auth.existingSecret`.
    existingSecretKey: SA_PASSWORD
  # -- Database name used in the derived connection string.
  database: SnapCd
  persistence:
    # -- Volume size.
    size: 20Gi
    # -- Storage class. Empty uses the cluster default.
    storageClass: ""
    # -- Access modes.
    accessModes:
      - ReadWriteOnce
  # -- SQL Server resources.
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: 2000m
  # -- SQL Server pod annotations.
  podAnnotations: {}
  # -- SQL Server pod labels.
  podLabels: {}
  # -- SQL Server pod security context. The image runs as `mssql`, UID and GID 10001.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- SQL Server container security context. `NET_BIND_SERVICE` is the one capability the restricted profile permits adding, and the `sqlservr` binary will not start without it, since it carries that file capability.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
  # -- SQL Server node selector.
  nodeSelector: {}
  # -- SQL Server tolerations.
  tolerations: []
  # -- SQL Server affinity.
  affinity: {}

redis:
  # -- Deploy a bundled Redis. For trials; use `cache.*` for a managed cache.
  enabled: true
  # -- Overrides the full resource name of Redis.
  fullnameOverride: ""
  image:
    # -- Redis image registry. Empty pulls from Docker Hub.
    registry: ""
    # -- Redis image repository.
    repository: redis
    # -- Redis image tag.
    tag: 7-alpine
    # -- Redis image digest.
    digest: ""
    # -- Redis image pull policy.
    pullPolicy: IfNotPresent
  nodePort:
    # -- Expose Redis on a node port. For a local cluster only: it puts the cache on the host,
    # reachable by anything that can reach the node.
    enabled: false
    # -- Node port to expose Redis on. Must be within the cluster's node port range, and on kind
    # the same port must be mapped when the cluster is created.
    port: 31379
  # -- Redis resources.
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  # -- Redis pod annotations.
  podAnnotations: {}
  # -- Redis pod labels.
  podLabels: {}
  # -- Redis pod security context. The image's `redis` user is UID 999, GID 1000.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # -- Redis container security context.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- Redis node selector.
  nodeSelector: {}
  # -- Redis tolerations.
  tolerations: []
  # -- Redis affinity.
  affinity: {}

externalSettings:
  # -- `externalsettings.json` as a map, mounted at `/app/externalsettings.json`. Each entry in `Providers` names a `Loader` (`AzureKeyVault`, `AmazonSecretsManager` or `Literal`), its `Configuration`, and in `Data` the settings it supplies. Settings from this file win over `appsettings.json` and environment variables.
  # @default -- `{}`
  content: {}
  # -- Name of an existing Secret holding `externalsettings.json`. When set, `externalSettings.content` is ignored.
  existingSecret: ""
  # -- Key of `externalsettings.json` in `externalSettings.existingSecret`.
  existingSecretKey: externalsettings.json

# -- Extra manifests, rendered through `tpl`.
extraManifests: []
