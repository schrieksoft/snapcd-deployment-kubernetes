suite: secret
templates:
  - secret.yaml
tests:
  - it: fails with no client secret source
    set:
      credentials.clientSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: 'credentials.clientSecret or credentials.existingSecret is required'

  - it: creates nothing when an existing Secret is used
    set:
      credentials.existingSecret: mine
    asserts:
      - hasDocuments:
          count: 0
