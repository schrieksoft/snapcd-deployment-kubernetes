suite: serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: snapcd-runner
  namespace: snapcd-runner
tests:
  - it: annotates for each cloud's workload identity
    set:
      workloadIdentity.azure.clientId: azure-client
      workloadIdentity.aws.roleArn: arn:aws:iam::1:role/r
      workloadIdentity.gcp.serviceAccount: sa@p.iam.gserviceaccount.com
      serviceAccount.annotations:
        custom: kept
    asserts:
      - equal:
          path: metadata.annotations
          value:
            azure.workload.identity/client-id: azure-client
            eks.amazonaws.com/role-arn: arn:aws:iam::1:role/r
            iam.gke.io/gcp-service-account: sa@p.iam.gserviceaccount.com
            custom: kept

  - it: has no annotations by default
    asserts:
      - notExists:
          path: metadata.annotations
