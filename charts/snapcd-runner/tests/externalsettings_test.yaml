suite: externalsettings
templates:
  - statefulset.yaml
  - externalsettings.yaml
release:
  name: snapcd-runner
  namespace: snapcd-runner
set:
  replicaCount: 1
tests:
  - it: mounts nothing without externalSettings
    template: statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: externalsettings
          any: true

  - it: renders the content into a Secret and mounts it at /app/externalsettings.json
    set:
      externalSettings.content:
        Providers:
          - Loader: Literal
            Configuration: {}
            Data:
              Some:
                Setting: value
    asserts:
      - template: externalsettings.yaml
        isKind:
          of: Secret
      - template: externalsettings.yaml
        matchRegex:
          path: data["externalsettings.json"]
          pattern: '"Loader": "Literal"'
          decodeBase64: true
      - template: statefulset.yaml
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: externalsettings
            mountPath: /app/externalsettings.json
            subPath: externalsettings.json
            readOnly: true
      - template: statefulset.yaml
        exists:
          path: spec.template.metadata.annotations["checksum/externalsettings"]

  - it: mounts an existing Secret under its key and renders no Secret of its own
    set:
      externalSettings.existingSecret: mine
      externalSettings.existingSecretKey: settings.json
    asserts:
      - template: externalsettings.yaml
        hasDocuments:
          count: 0
      - template: statefulset.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: externalsettings
            secret:
              secretName: mine
              items:
                - key: settings.json
                  path: externalsettings.json
      - template: statefulset.yaml
        notExists:
          path: spec.template.metadata.annotations["checksum/externalsettings"]
