apiVersion: v1
kind: Service
metadata:
  name: {{ include "snapcd-runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-runner.labels" (dict "ctx" $ "component" "runner") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "snapcd-runner.selectorLabels" (dict "ctx" $ "component" "runner") | nindent 4 }}
  ports:
    - name: http
      port: 5001
      targetPort: http
