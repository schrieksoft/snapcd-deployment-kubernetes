{{- if not .Values.credentials.existingSecret }}
{{- if not .Values.credentials.clientSecret }}
{{- fail "credentials.clientSecret or credentials.existingSecret is required: the Runner authenticates to the Server with it." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snapcd-runner.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-runner.labels" (dict "ctx" $ "component" "runner") | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.existingSecretKey }}: {{ .Values.credentials.clientSecret | b64enc }}
{{- end }}
