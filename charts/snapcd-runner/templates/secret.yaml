{{- if and (not .Values.credentials.existingSecret) (ne .Values.credentials.mode "Federated") }}
{{- if not .Values.credentials.clientSecret }}
{{- fail "credentials.clientSecret or credentials.existingSecret is required: the Runner authenticates to the Server with it. Set credentials.mode=Federated to authenticate with a projected ServiceAccount token instead." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snapcd-runner.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-runner.labels" (dict "ctx" $ "component" "runner") | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.existingSecretKey }}: {{ .Values.credentials.clientSecret | b64enc }}
{{- end }}
