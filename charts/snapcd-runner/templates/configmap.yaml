{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snapcd-runner.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-runner.labels" (dict "ctx" $ "component" "runner") | nindent 4 }}
data:
  appsettings.json: |
    {{- $appsettings := deepCopy .Values.config.appsettings }}
    {{- if and (eq .Values.credentials.mode "Federated") (hasKey $appsettings "RunnerEnvVars") }}
    {{- $_ := unset $appsettings.RunnerEnvVars "SNAPCD_CLIENT_SECRET" }}
    {{- end }}
    {{- toPrettyJson $appsettings | nindent 4 }}
{{- end }}
