image:
  # -- Image registry. Set to a mirror (Artifactory, Harbor, ACR) to pull through it.
  registry: ghcr.io
  # -- Image repository.
  repository: schrieksoft/snapcd/snapcd-agent
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image digest. Takes precedence over the tag when set.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for the Agent and the sidecar.
imagePullSecrets: []

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name.
fullnameOverride: ""

# -- Labels added to every resource.
commonLabels: {}

config:
  # -- Name of an existing ConfigMap holding `appsettings.json`. When set, `config.appsettings` is ignored and the chart derives nothing into it.
  existingConfigMap: ""
  # -- Key of `appsettings.json` in `config.existingConfigMap`.
  existingConfigMapKey: appsettings.json
  # -- The Agent's `appsettings.json` as a map, rendered into a ConfigMap. It holds no secrets: the client secret comes from `credentials`. The chart fills `Agent.Sidecars` with the Claude sidecar when that key is absent. The defaults are the reference deployment's sample settings, the same as `components/agent/config/appsettings.json` and the Docker deployment, and connect to a Server installed as `snapcd-server` in the `snapcd-server` namespace. See the Snap CD agent settings reference for every key.
  # @default -- the reference deployment's sample settings
  appsettings:
    Logging:
      LogLevel:
        Default: Warning
        SnapCd: Information
    Server:
      Url: http://snapcd-server.snapcd-server.svc.cluster.local:5000
    Agent:
      OrganizationId: 10000000-0000-0000-0000-000000000000
      AgentId: 20000000-0000-0000-0000-000000000000
      InstanceName: myagent
      ClientId: defaultAgent

credentials:
  # -- The Agent's client secret, injected as `Agent__ClientSecret`. The default is the reference deployment's public sample secret for the pre-seeded `defaultAgent` service principal.
  clientSecret: "defaultAgent"
  # -- Name of an existing Secret holding the client secret.
  existingSecret: ""
  # -- Key of the client secret in `credentials.existingSecret`.
  existingSecretKey: Agent__ClientSecret

serviceAccount:
  # -- Create a ServiceAccount for the Agent and the sidecar.
  create: true
  # -- ServiceAccount name. Defaults to the full name when `create` is true, and to `default` otherwise.
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}
  # -- Mount the ServiceAccount token into the pods.
  automount: true

# -- Agent pod annotations.
podAnnotations: {}
# -- Agent pod labels.
podLabels: {}
# -- Agent pod security context. The defaults meet the restricted pod security profile; the images run as UID and GID 1654, and `fsGroup` makes provisioned volumes writable by it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault
# -- Agent container security context. The defaults meet the restricted pod security profile.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Agent container resources. The Agent only relays between the Server and its sidecar; inference runs in the sidecar.
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m

# -- Node selector, for the Agent and the sidecar.
nodeSelector: {}
# -- Tolerations, for the Agent and the sidecar.
tolerations: []
# -- Affinity, for the Agent and the sidecar.
affinity: {}
# -- Priority class name, for the Agent and the sidecar.
priorityClassName: ""

# -- Extra environment variables for the Agent container.
extraEnv: []
# -- Extra `envFrom` sources for the Agent container.
extraEnvFrom: []
# -- Extra volumes for the Agent pod.
extraVolumes: []
# -- Extra volume mounts for the Agent container.
extraVolumeMounts: []

sidecar:
  # -- Deploy the Claude sidecar, the Agent's inference provider. It needs exactly one of `credentials.oauthToken`, `credentials.apiKey`, or an existing Secret holding one.
  enabled: true
  image:
    # -- Sidecar image registry.
    registry: ghcr.io
    # -- Sidecar image repository.
    repository: schrieksoft/snapcd/snapcd-agent-sidecar-claude
    # -- Sidecar image tag. Defaults to the chart's appVersion.
    tag: ""
    # -- Sidecar image digest.
    digest: ""
    # -- Sidecar image pull policy.
    pullPolicy: IfNotPresent
  # -- Port the sidecar serves on.
  port: 7001
  # -- Server URL the sidecar calls for MCP. Defaults to the Agent's `Server.Url`.
  serverUrl: ""
  credentials:
    # -- Claude subscription token (`sk-ant-oat01-...`), as `CLAUDE_CODE_OAUTH_TOKEN`. Set this or `apiKey`, not both.
    oauthToken: ""
    # -- Anthropic API key (`sk-ant-api03-...`), as `ANTHROPIC_API_KEY`. Set this or `oauthToken`, not both.
    apiKey: ""
    # -- GitHub token for the AutoFix path (clone and open a pull request), as `GITHUB_TOKEN`. Optional.
    githubToken: ""
    # -- Name of an existing Secret holding `CLAUDE_CODE_OAUTH_TOKEN` or `ANTHROPIC_API_KEY`, and optionally `GITHUB_TOKEN`. Every key is optional in it.
    existingSecret: ""
  # -- Sidecar pod annotations.
  podAnnotations: {}
  # -- Sidecar pod labels.
  podLabels: {}
  # -- Sidecar pod security context. The sidecar image's `app` user is UID and GID 1000, unlike the .NET images' 1654.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # -- Sidecar container security context. The root filesystem stays writable: the Claude CLI lives in the home directory and writes `~/.claude.json` beside it, so the home directory cannot be replaced with an empty volume.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- Sidecar resources. The Claude CLI runs in this container during a mission.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: 1000m
  # -- Sidecar readiness probe.
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
  # -- Sidecar liveness probe.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
  # -- Extra environment variables for the sidecar.
  extraEnv: []

externalSettings:
  # -- `externalsettings.json` as a map, mounted at `/app/externalsettings.json`. Each entry in `Providers` names a `Loader` (`AzureKeyVault`, `AmazonSecretsManager` or `Literal`), its `Configuration`, and in `Data` the settings it supplies. Settings from this file win over `appsettings.json` and environment variables.
  # @default -- `{}`
  content: {}
  # -- Name of an existing Secret holding `externalsettings.json`. When set, `externalSettings.content` is ignored.
  existingSecret: ""
  # -- Key of `externalsettings.json` in `externalSettings.existingSecret`.
  existingSecretKey: externalsettings.json

# -- Extra manifests, rendered through `tpl`.
extraManifests: []
