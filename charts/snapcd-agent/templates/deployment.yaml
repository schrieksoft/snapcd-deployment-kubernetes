apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snapcd-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-agent.labels" (dict "ctx" $ "component" "agent") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "snapcd-agent.selectorLabels" (dict "ctx" $ "component" "agent") | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations (not .Values.config.existingConfigMap) .Values.externalSettings.content }}
      annotations:
        {{- if not .Values.config.existingConfigMap }}
        checksum/config: {{ include "snapcd-agent.appsettings" . | sha256sum }}
        {{- end }}
      {{- if and .Values.externalSettings.content (not .Values.externalSettings.existingSecret) }}
        checksum/externalsettings: {{ toJson .Values.externalSettings.content | sha256sum }}
      {{- end }}
        {{- with .Values.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "snapcd-agent.labels" (dict "ctx" $ "component" "agent") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snapcd-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: snapcd-agent
          image: {{ include "snapcd-agent.image" (dict "image" .Values.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Agent__InstanceName
              value: "$(POD_NAME)"
            - name: Agent__CredentialMode
              value: {{ .Values.credentials.mode | quote }}
            {{- if eq .Values.credentials.mode "Federated" }}
            - name: Agent__AssertionTokenPath
              value: /var/run/secrets/snapcd/token
            {{- else }}
            - name: Agent__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "snapcd-agent.credentialsSecretName" . }}
                  key: {{ .Values.credentials.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if eq .Values.credentials.mode "Federated" }}
            - name: federated-token
              mountPath: /var/run/secrets/snapcd
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            - name: config
              mountPath: /app/appsettings.json
              subPath: appsettings.json
            {{- if include "snapcd-agent.hasExternalSettings" . }}
            - name: externalsettings
              mountPath: /app/externalsettings.json
              subPath: externalsettings.json
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if eq .Values.credentials.mode "Federated" }}
        - name: federated-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.credentials.audience }}
                  expirationSeconds: {{ .Values.credentials.tokenExpirationSeconds }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "snapcd-agent.configMapName" . }}
            items:
              - key: {{ ternary .Values.config.existingConfigMapKey "appsettings.json" (not (empty .Values.config.existingConfigMap)) }}
                path: appsettings.json
        {{- if include "snapcd-agent.hasExternalSettings" . }}
        - name: externalsettings
          secret:
            secretName: {{ include "snapcd-agent.externalSettingsSecretName" . }}
            items:
              - key: {{ ternary .Values.externalSettings.existingSecretKey "externalsettings.json" (not (empty .Values.externalSettings.existingSecret)) }}
                path: externalsettings.json
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
