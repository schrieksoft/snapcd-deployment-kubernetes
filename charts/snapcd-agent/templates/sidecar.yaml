{{- if .Values.sidecar.enabled }}
{{- $creds := .Values.sidecar.credentials }}
{{- if not $creds.existingSecret }}
{{- if and $creds.oauthToken $creds.apiKey }}
{{- fail "Set one of sidecar.credentials.oauthToken and sidecar.credentials.apiKey, not both." }}
{{- end }}
{{- if not (or $creds.oauthToken $creds.apiKey) }}
{{- fail "The Claude sidecar needs a credential: set sidecar.credentials.oauthToken, sidecar.credentials.apiKey or sidecar.credentials.existingSecret, or set sidecar.enabled=false to run the Agent without it." }}
{{- end }}
{{- end }}
{{- $name := include "snapcd-agent.sidecar.fullname" . }}
{{- $serverUrl := include "snapcd-agent.sidecar.serverUrl" . }}
{{- if not $serverUrl }}
{{- fail "The Claude sidecar needs the Server's URL: set sidecar.serverUrl or config.appsettings.Server.Url." }}
{{- end }}
{{- if not $creds.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snapcd-agent.sidecar.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-agent.labels" (dict "ctx" $ "component" "sidecar-claude") | nindent 4 }}
type: Opaque
data:
  {{- with $creds.oauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ . | b64enc }}
  {{- end }}
  {{- with $creds.apiKey }}
  ANTHROPIC_API_KEY: {{ . | b64enc }}
  {{- end }}
  {{- with $creds.githubToken }}
  GITHUB_TOKEN: {{ . | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-agent.labels" (dict "ctx" $ "component" "sidecar-claude") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "snapcd-agent.selectorLabels" (dict "ctx" $ "component" "sidecar-claude") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.sidecar.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapcd-agent.labels" (dict "ctx" $ "component" "sidecar-claude") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "snapcd-agent.selectorLabels" (dict "ctx" $ "component" "sidecar-claude") | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.sidecar.podAnnotations (not $creds.existingSecret) }}
      annotations:
        {{- if not $creds.existingSecret }}
        checksum/credentials: {{ toJson $creds | sha256sum }}
        {{- end }}
        {{- with .Values.sidecar.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "snapcd-agent.labels" (dict "ctx" $ "component" "sidecar-claude") | nindent 8 }}
        {{- with .Values.sidecar.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snapcd-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.sidecar.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: snapcd-agent-sidecar-claude
          image: {{ include "snapcd-agent.image" (dict "image" .Values.sidecar.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
          {{- with .Values.sidecar.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.sidecar.port | quote }}
            - name: SNAPCD_BASE_URL
              value: {{ $serverUrl | quote }}
            {{- range $key := list "CLAUDE_CODE_OAUTH_TOKEN" "ANTHROPIC_API_KEY" "GITHUB_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "snapcd-agent.sidecar.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- with .Values.sidecar.extraEnv }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.sidecar.port }}
          {{- with .Values.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sidecar.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sidecar.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
